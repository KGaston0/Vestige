[project]
name = "vestige-backend"
version = "0.1.0"
description = "Tactical Ephemeral Forensic Backend for Lateral Movement Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "polars>=0.20.0",
    "networkx>=3.2.1",
    "rustworkx>=0.14.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
